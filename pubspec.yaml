name: binsight
description: "IoT-Based Smart Waste Monitoring System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # FIREBASE
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.1.0

  # LOCAL STORAGE
  shared_preferences: ^2.3.2
  http: ^1.2.2
  http_parser: ^4.1.2

  # QR CODE
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # IMAGE HANDLING
  image_picker: ^1.0.0
  cached_network_image: ^3.2.3

  # FONTS
  google_fonts: ^6.2.1

  # Mapping and Location
  flutter_osm_plugin: ^0.8.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash.png
